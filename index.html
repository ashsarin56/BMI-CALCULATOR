<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI-Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="main">
      <div class="container">
        <h1>BMI CALCULATOR</h1>
        <h3>HEIGHT</h3>
        <input type="number" class="inph" placeholder="ENTER THE HEIGHT IN METER" autofocus>
        <h3>WEIGHT</h3>
        <input type="number" class="inpw" placeholder="ENTER THE WEIGHT IN KILOGRAM" autofocus>
        <div class="output">    </div>
        <button class="btn">Calculate</button>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
